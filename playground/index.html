<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiltshire Scouts theme playground</title>
    <script>(function(){try{var m=document.cookie.match(/(?:^|;\s*)ws-theme=(light|dark)/),p=m?m[1]:null;if(!p){try{var s=localStorage.getItem("ws-theme");if(s==="light"||s==="dark")p=s}catch(e){}}var d=p==="dark"||(!p&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light")}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
